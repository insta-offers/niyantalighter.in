<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Add delivery address — Replica</title>
<style>
  :root {
    --accent: #ff6a00;
    --muted: #9aa3ad;
    --border: #e1e6ea;
    --input-bg: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial;
  }

  body {
    margin: 0;
    background: #f7f8f9;
    color: #263238;
    -webkit-tap-highlight-color: transparent;
  }

  /* ====== WRAPPER ====== */
  .wrap {
    max-width: 480px;
    margin: 12px auto 30px;
    padding: 0 14px;
  }

  /* ====== TOPBAR ====== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0 16px;
  }

  .back {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #111;
    background: #fff;
    border: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
  }

  .title {
    font-weight: 600;
    font-size: 18px;
  }

  /* ====== STEPS ====== */
  .steps {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 6px 0 16px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .step .circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 1px solid var(--border);
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }

  .progress-line {
    height: 1px;
    background: #eee;
    flex: 1;
  }

  /* ====== CARD ====== */
  .card {
    background: var(--input-bg);
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(20,30,40,0.04);
    border: 1px solid rgba(0,0,0,0.02);
  }

  /* ====== FORM FIELDS ====== */
  form .field {
    margin-bottom: 14px;
  }

  input[type="text"],
  input[type="tel"],
  select {
    width: 100%;
    padding: 15px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    box-sizing: border-box;
    font-size: 15px;
    color: #222;
    outline: none;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }

  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa3ad' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
    padding-right: 38px;
  }

  input[readonly] {
    background: #f9fafb;
    color: #455a64;
    font-weight: 600;
  }

  input::placeholder {
    color: #bfc9cf;
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .row .col {
    flex: 1;
    min-width: 0;
  }

  .linksmall {
    color: #2b7bd8;
    font-size: 13px;
    margin: 6px 0;
    display: inline-block;
    cursor: pointer;
    user-select: none;
  }

  /* ====== USE LOCATION BUTTON ====== */
  .use-location {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px 14px;
    border-radius: 10px;
    background: #1e90ff;
    color: white;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  .use-location:disabled {
    opacity: 0.7;
    cursor: wait;
  }

  .use-location .icon {
    width: 16px;
    height: 16px;
  }

  /* ====== ADDRESS TYPE PILL ====== */
  .type-group {
    display: flex;
    gap: 16px;
    padding: 14px 0 6px;
  }

  .pill {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 14px;
    border-radius: 30px;
    background: #fff;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all .25s ease;
    font-weight: 500;
    font-size: 14px;
  }

  .pill:hover {
    border-color: #bbb;
  }

  .pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .pill.active svg path,
  .pill.active svg rect {
    stroke: #fff;
  }

  /* ====== SAVE BUTTON ====== */
  .save {
    margin-top: 14px;
    width: 100%;
    padding: 16px;
    border-radius: 8px;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Responsive adjustments */
  @media (min-width: 600px) {
    .wrap {
      max-width: 600px;
    }
    .type-group {
      gap: 24px;
    }
  }

  @media (min-width: 900px) {
    .wrap {
      max-width: 800px;
    }
    .type-group {
      gap: 40px;
      justify-content: center;
    }
    .card {
      padding: 24px;
    }
    input[type="text"],
    input[type="tel"],
    select {
      font-size: 16px;
      padding: 18px;
    }
    .use-location {
      padding: 18px 16px;
      font-size: 15px;
    }
    .save {
      font-size: 20px;
      padding: 18px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="back" onclick="window.location.href='index.html'" title="Back to Home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title">Add delivery address</div>
  </div>

  <div class="steps">
    <div class="step">
      <div class="circle">1</div><div style="font-weight:600;color:#263238">Address</div>
    </div>
    <div class="progress-line"></div>
    <div class="step" style="opacity:.6">
      <div class="circle">2</div><div>Order Summary</div>
    </div>
    <div class="progress-line"></div>
    <div class="step" style="opacity:.6">
      <div class="circle">3</div><div>Payment</div>
    </div>
  </div>

  <div class="card">
    <form id="addrForm" autocomplete="on">
      <div class="field">
        <input id="fullname" name="name" type="text" autocomplete="name" placeholder="Full Name (Required) *" required>
      </div>

      <div class="field">
        <input id="phone" name="tel" type="tel" autocomplete="tel-national" maxlength="10" pattern="[0-9]{10}" placeholder="Phone number (Required) *" required>
        <div id="addAlt" class="linksmall">+ Add Alternate Phone Number</div>
        <div id="altWrap" style="display:none;margin-top:8px">
          <input id="altphone" name="alt-tel" type="tel" maxlength="10" placeholder="Alternate phone number">
        </div>
      </div>

      <div class="field">
        <input id="country" name="country" type="text" autocomplete="country-name" value="India" readonly>
      </div>

      <div class="row">
        <div class="col">
          <input id="pincode" name="postal-code" type="tel" autocomplete="postal-code" maxlength="6" placeholder="Pincode (Required) *" required>
        </div>
        <div>
          <button type="button" id="locBtn" class="use-location" onclick="getLocation()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
            </svg>
            <span id="locText">Use my location</span>
          </button>
        </div>
      </div>

      <div class="row" style="margin-top:14px;margin-bottom:14px">
        <div class="col">
          <select id="state" name="address-level1" autocomplete="address-level1" required>
            <option value="" disabled selected>State (Required) *</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Bihar">Bihar</option>
            <option value="Chhattisgarh">Chhattisgarh</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Tripura">Tripura</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarakhand">Uttarakhand</option>
            <option value="West Bengal">West Bengal</option>
            <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
            <option value="Chandigarh">Chandigarh</option>
            <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
            <option value="Delhi">Delhi</option>
            <option value="Jammu and Kashmir">Jammu and Kashmir</option>
            <option value="Ladakh">Ladakh</option>
            <option value="Lakshadweep">Lakshadweep</option>
            <option value="Puducherry">Puducherry</option>
          </select>
        </div>
        <div class="col">
          <input id="city" name="address-level2" type="text" autocomplete="address-level2" placeholder="City (Required) *" required>
        </div>
      </div>

      <div class="field">
        <input id="house" name="address-line1" type="text" autocomplete="address-line1" placeholder="House No., Building Name (Required) *" required>
      </div>
      <div class="field">
        <input id="road" name="address-line2" type="text" autocomplete="address-line2" placeholder="Road name, Area, Colony (Required) *" required>
      </div>
      
      <div class="field">
        <div id="addLandmark" class="linksmall">+ Add Nearby Famous Shop/Mall/Landmark</div>
        <div id="landmarkWrap" style="display:none;margin-top:8px">
          <input id="landmark" name="landmark" type="text" placeholder="Nearby Famous Shop/Mall/Landmark">
        </div>
      </div>

      <div style="font-size:13px;color:#9aa3ad">Type of address</div>
      <div class="type-group">
        <div class="pill active" data-type="Home" onclick="chooseType(event)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7" stroke="#666" stroke-width="1.6"/><path d="M5 11v7a2 2 0 002 2h10a2 2 0 002-2v-7" stroke="#666" stroke-width="1.6"/></svg>
          Home
        </div>
        <div class="pill" data-type="Work" onclick="chooseType(event)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="12" rx="2" stroke="#666" stroke-width="1.6"/><path d="M8 7V5a1 1 0 011-1h6a1 1 0 011 1v2" stroke="#666" stroke-width="1.6"/></svg>
          Work
        </div>
      </div>

      <button class="save" type="submit">Save Address</button>
    </form>
  </div>
</div>

<script>
  let selectedType = "Home";

  // Alternate phone toggle
  document.getElementById('addAlt').addEventListener('click', function() {
    document.getElementById('altWrap').style.display = 'block';
    this.style.display = 'none';
  });

  // Landmark toggle
  document.getElementById('addLandmark').addEventListener('click', function() {
    document.getElementById('landmarkWrap').style.display = 'block';
    this.style.display = 'none';
  });

  // Pill selection
  function chooseType(e) {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    e.currentTarget.classList.add('active');
    selectedType = e.currentTarget.getAttribute('data-type');
  }

  // Helper to match state name in dropdown
  function setStateValue(stateName) {
    if (!stateName) return;
    const stateSelect = document.getElementById('state');
    const cleanInput = stateName.trim().toLowerCase();
    for (let i = 0; i < stateSelect.options.length; i++) {
      if (stateSelect.options[i].value.toLowerCase() === cleanInput) {
        stateSelect.selectedIndex = i;
        break;
      }
    }
  }

  // Auto-fill City & State via 6-digit Indian Pincode
  document.getElementById('pincode').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '');
    if (this.value.length === 6) {
      fetch(`https://api.postalpincode.in/pincode/${this.value}`)
        .then(res => res.json())
        .then(data => {
          if (data && data[0].Status === "Success" && data[0].PostOffice.length > 0) {
            const po = data[0].PostOffice[0];
            document.getElementById('city').value = po.District || po.Block || "";
            setStateValue(po.State);
            saveFormCache();
          }
        })
        .catch(() => {});
    }
  });

  // Auto-fill Address using GPS Location
  function getLocation() {
    const btn = document.getElementById('locBtn');
    const txt = document.getElementById('locText');

    if (!navigator.geolocation) {
      alert("Aapke browser mein location support nahi hai.");
      return;
    }

    btn.disabled = true;
    txt.innerText = "Locating...";

    navigator.geolocation.getCurrentPosition(
      function(pos) {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.address) {
              const addr = data.address;
              if (addr.postcode) {
                document.getElementById('pincode').value = addr.postcode.replace(/\D/g, '').slice(0, 6);
              }
              document.getElementById('city').value = addr.city || addr.town || addr.village || addr.state_district || "";
              setStateValue(addr.state);
              
              const areaParts = [addr.suburb, addr.neighbourhood, addr.road].filter(Boolean);
              if (areaParts.length > 0 && !document.getElementById('road').value) {
                document.getElementById('road').value = areaParts.join(", ");
              }
              saveFormCache();
            }
            btn.disabled = false;
            txt.innerText = "Use my location";
          })
          .catch(() => {
            btn.disabled = false;
            txt.innerText = "Use my location";
            alert("Location fetch karne mein dikkat aayi, kripya manually bharein.");
          });
      },
      function() {
        btn.disabled = false;
        txt.innerText = "Use my location";
        alert("Location permission allow karein ya pincode dalein.");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // Save & Restore Customer Data automatically in LocalStorage
  const fieldIds = ['fullname', 'phone', 'altphone', 'pincode', 'state', 'city', 'house', 'road', 'landmark'];

  function saveFormCache() {
    const cache = {};
    fieldIds.forEach(id => {
      cache[id] = document.getElementById(id).value;
    });
    localStorage.setItem('savedCustomerAddress', JSON.stringify(cache));
  }

  fieldIds.forEach(id => {
    document.getElementById(id).addEventListener('input', saveFormCache);
    document.getElementById(id).addEventListener('change', saveFormCache);
  });

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('savedCustomerAddress');
    if (saved) {
      try {
        const cache = JSON.parse(saved);
        fieldIds.forEach(id => {
          if (cache[id]) {
            document.getElementById(id).value = cache[id];
            if (id === 'altphone') {
              document.getElementById('altWrap').style.display = 'block';
              document.getElementById('addAlt').style.display = 'none';
            }
            if (id === 'landmark') {
              document.getElementById('landmarkWrap').style.display = 'block';
              document.getElementById('addLandmark').style.display = 'none';
            }
          }
        });
      } catch (e) {}
    }
  });

  // Save button & Send formatted details to WhatsApp (7726861916)
  document.getElementById('addrForm').addEventListener('submit', function(e) {
    e.preventDefault();
    saveFormCache();

    const fullname = document.getElementById('fullname').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const altphone = document.getElementById('altphone').value.trim();
    const country = document.getElementById('country').value.trim();
    const pincode = document.getElementById('pincode').value.trim();
    const state = document.getElementById('state').value.trim();
    const city = document.getElementById('city').value.trim();
    const house = document.getElementById('house').value.trim();
    const road = document.getElementById('road').value.trim();
    const landmark = document.getElementById('landmark').value.trim();

    let message = `*New Delivery Address Details*\n\n`;
    message += `*Full Name:* ${fullname}\n`;
    message += `*Phone Number:* ${phone}\n`;
    if (altphone) message += `*Alternate Phone:* ${altphone}\n`;
    message += `*Country:* ${country}\n`;
    message += `*Pincode:* ${pincode}\n`;
    message += `*State:* ${state}\n`;
    message += `*City:* ${city}\n`;
    message += `*House No./Building:* ${house}\n`;
    message += `*Road/Area/Colony:* ${road}\n`;
    if (landmark) message += `*Landmark:* ${landmark}\n`;
    message += `*Address Type:* ${selectedType}`;

    const whatsappNumber = "917726861916";
    const encodedMsg = encodeURIComponent(message);
    window.location.href = `https://wa.me/${whatsappNumber}?text=${encodedMsg}`;
  });
</script>
</body>
</html>
